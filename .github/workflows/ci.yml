name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CGO_ENABLED: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: true

    - name: Install Dependencies
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        # errcheck is pinned for the same reason gosec is: v1.30.0 added a
        # check (a channel receive that drops an error) that turned the gate
        # red with no code change. A pin makes the gate a property of the
        # repository rather than of the day it ran.
        go install github.com/kisielk/errcheck@v1.30.0
        # gosec is pinned, not @latest. Its last release, v2.29.0, builds
        # against golang.org/x/tools v0.49.0, whose importer reads export data
        # up to version 4; the runner's Go toolchain emits version 5, so gosec
        # failed to type-check the package and exited 1 with "Issues: 0". This
        # commit is the first with x/tools v0.52.0. Move back to @latest once a
        # gosec release carries it.
        go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261015133444-707f2271f665
        go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Go Format Check
      run: |
        if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
          echo "Code not formatted:"
          gofmt -l .
          exit 1
        fi

    - name: Module Verification
      run: go mod verify

    - name: Go Vet
      run: go vet ./...

    - name: Staticcheck
      run: staticcheck ./...

    # errcheck was in `make check` but never in CI, so the only thing running
    # it was whoever remembered to. Note the default: assignments to the blank
    # identifier are NOT reported, which is how the v1.7.2 audit bug reached a
    # release past a green gate.
    - name: Errcheck
      run: errcheck ./...

    - name: Vulnerability Check
      run: govulncheck ./...

    # gosec must be able to fail the build. It previously ran with BOTH
    # continue-on-error and "|| true", so a finding could never stop a merge.
    - name: Security Scan (gosec)
      run: gosec -conf .gosec.json ./...

    - name: Test with Race Detection
      run: go test -race -timeout 5m -v ./...

    - name: Test Coverage
      run: |
        go test -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    name: Build Matrix
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['stable']  # Reduced to save minutes
        include:
          - os: macos-latest
            timeout: 5  # Shorter timeout for macOS due to runner availability issues
          - os: windows-latest
            test-timeout: 10m  # Windows runners are slower; fuzz seed corpus needs more time
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Build
      run: go build -v ./...
      timeout-minutes: ${{ matrix.timeout || 15 }}

    - name: Short Test (no race, faster)
      run: go test -short -timeout ${{ matrix.test-timeout || '5m' }} ./...
      timeout-minutes: ${{ matrix.timeout || 15 }}

  # The root module is only part of the repository. cmd/cli, the examples and
  # the benchmarks are separate modules that "go build ./..." never reaches, so
  # they drifted until none of them compiled: every one declared an older go
  # directive than the root module requires. This job keeps them honest.
  submodules:
    name: Submodules
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        cache: true

    - name: Type-check documentation examples
      run: ./scripts/check-doc-examples.sh

    - name: Build and test every submodule
      run: |
        set -euo pipefail
        status=0
        for mod in $(find . -mindepth 2 -name go.mod | sort); do
          dir=$(dirname "$mod")
          echo "::group::$dir"
          (cd "$dir" && go build ./... && go vet ./... && go test -count=1 -timeout 5m ./...) || status=1
          echo "::endgroup::"
        done
        exit $status
