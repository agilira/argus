name: PR Quick Check

on:
  pull_request:
    branches: [ main ]

env:
  CGO_ENABLED: 1

jobs:
  quick-test:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        cache: true

    - name: Quick Quality Check
      run: |
        # Format check
        test -z "$(gofmt -l .)"
        
        # Vet
        go vet ./...
        
        # Basic test
        go test -short ./...

    - name: Install Security Tools
      run: |
        # gosec is pinned, not @latest. Its last release, v2.29.0, builds
        # against golang.org/x/tools v0.49.0, whose importer reads export data
        # up to version 4; the runner's Go toolchain emits version 5, so gosec
        # failed to type-check the package and exited 1 with "Issues: 0". This
        # commit is the first with x/tools v0.52.0. Move back to @latest once a
        # gosec release carries it.
        go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261015133444-707f2271f665

    - name: Security Scan
      run: |
        # Only scan the main module and cmd, exclude examples and benchmarks with separate go.mod
        gosec --exclude=G104,G306,G301 \
          --exclude-dir=examples \
          --exclude-dir=benchmarks \
          --exclude-dir=overhead-benchmarks \
          ./ ./cmd/...
