name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 'stable' rather than a pinned minor: this job pinned 1.24 while go.mod
    # moved to 1.25.9, which would have failed every step below.
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Install development tools
      run: make tools

    - name: Run tests
      run: make test

    - name: Run security checks
      run: make security

    # The CLI lives in the cmd/cli module (it depends on Orpheus, which the
    # library must not). These commands used to build the ROOT package — a
    # library — so the five published "CLI Binary" files were ar archives, not
    # executables, while the release notes told people to run ./argus.
    #
    # CGO_ENABLED=0 because go-sqlite3 needs cgo and cross-compiling it would
    # need a toolchain per target. The consequence is stated in the release
    # notes rather than hidden: these binaries do config and watch operations
    # fully, and degrade to no SQLite audit backend. `go install` produces a
    # build with audit included.
    - name: Build artifacts
      env:
        CGO_ENABLED: 0
      run: |
        set -euo pipefail
        mkdir -p dist
        cd cmd/cli

        build() {
          GOOS="$1" GOARCH="$2" go build \
            -ldflags='-w -s -buildid=' -trimpath \
            -o "../../dist/$3" ./argus
        }

        build linux   amd64 argus-linux-amd64
        build linux   arm64 argus-linux-arm64
        build darwin  amd64 argus-darwin-amd64
        build darwin  arm64 argus-darwin-arm64
        build windows amd64 argus-windows-amd64.exe

        # A library package silently produces an archive instead of a program,
        # which is how the previous mistake went unnoticed. Refuse to publish
        # anything that is not an executable.
        cd ../../dist
        for artifact in argus-*; do
          if ! file "$artifact" | grep -qE 'executable|PE32'; then
            echo "::error::$artifact is not an executable: $(file "$artifact")"
            exit 1
          fi
        done

        # Create checksums
        sha256sum * > checksums.txt

    - name: Generate build provenance attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: 'dist/*'

    - name: Generate SBOM
      run: |
        # Generate SBOM from Go modules using syft
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
        /usr/local/bin/syft . -o spdx-json=sbom.json
        
    - name: Generate SBOM attestation  
      uses: actions/attest-sbom@v1
      with:
        subject-path: 'dist/*'
        sbom-path: 'sbom.json'

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*
        body: |
          ## Argus ${{ github.ref_name }}
          
          Dynamic configuration framework for Go applications with zero-allocation performance, universal format support, and ultra-fast CLI.
          
          ### Installation
          
          **Library:**
          ```bash
          go get github.com/agilira/argus@${{ github.ref_name }}
          ```
          
          **CLI Binary:**
          Download the appropriate binary for your platform from the attachments below.

          The published binaries are built without cgo, so they handle every
          config and watch operation but have no SQLite audit backend. For a
          build with audit included:

          ```bash
          go install github.com/agilira/argus/cmd/cli/argus@${{ github.ref_name }}
          ```
          
          ### CLI Usage
          ```bash
          # Configuration management
          ./argus config get config.yaml server.port
          ./argus config set config.yaml database.host localhost
          ./argus config convert config.yaml config.json
          ./argus watch config.yaml --interval=1s
          ```
          
          ### Verification
          Verify release authenticity using GitHub CLI:
          ```bash
          gh attestation verify ./argus-* --owner agilira
          ```
          
          ### Changes
          See [changelog/${{ github.ref_name }}.txt](https://github.com/agilira/argus/blob/main/changelog/${{ github.ref_name }}.txt) for details.
        generate_release_notes: true
        draft: false
        prerelease: false