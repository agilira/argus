name: Dependabot PR Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Dependabot-triggered runs get a read-only token unless the permissions are
# declared here; without this block the merge and comment steps below failed
# with "Resource not accessible by integration".
permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      # The update type comes from Dependabot's own metadata, not from parsing
      # the PR title. The previous title grep matched none of Dependabot's
      # "[chore](deps):" titles, so every bump was treated as major.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: |
          go mod download
          go test -v ./...

      # The same check as the Submodules job in ci.yml: this job merges, so it
      # must not merge a bump that leaves a submodule unbuildable.
      - name: Build and test every submodule
        run: |
          set -euo pipefail
          for mod in $(find . -mindepth 2 -name go.mod | sort); do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            (cd "$dir" && go build ./... && go vet ./... && go test -count=1 -timeout 5m ./...)
            echo "::endgroup::"
          done

      # Merged here, once the tests above have passed. "gh pr merge --auto"
      # needs branch protection rules on main, which this repository does not
      # have, and failed with "Protected branch rules not configured".
      - name: Merge patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --squash "${{ github.event.pull_request.number }}"
          # The merge, made with GITHUB_TOKEN, fires no push event: without
          # this, main would keep showing the CI result of the commit before.
          gh workflow run ci.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "**Manual review required**

          \`${{ steps.metadata.outputs.dependency-names }}\` is a major version update (\`${{ steps.metadata.outputs.previous-version }}\` -> \`${{ steps.metadata.outputs.new-version }}\`). Verify before merging:
          - [ ] Breaking changes
          - [ ] Compatibility with existing code
          - [ ] Security implications

          Merge manually when ready."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
